# Workflow name:
name: update_unary_database

# Workflow triggers:
on:
  push:
    paths:
      # List paths for which changes should trigger this workflow:
      - 'lib/node_modules/@stdlib/math/base/special/*/package.json'
      - 'lib/node_modules/@stdlib/number/*/base/identity/package.json'

  # Allow the workflow to be manually run:
  workflow_dispatch:

# Global permissions:
permissions:
  # Allow read and write access to the repository contents:
  contents: write
  # Allow creating and updating pull requests:
  pull-requests: write

# Workflow jobs:
jobs:

  # Define a job for updating the unary database...
  update:

    # Define a display name:
    name: 'Update unary database'

    # Ensure the job does not run on forks:
    if: github.repository == 'stdlib-js/stdlib'

    # Define the type of virtual host machine:
    runs-on: ubuntu-latest

    # Define the sequence of job steps...
    steps:
      # Checkout the repository:
      - name: 'Checkout repository'
        # Pin action to full length commit SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Specify whether to remove untracked files before checking out the repository:
          clean: true

          # Limit clone depth to the last 1000 commits:
          fetch-depth: 1000

          # Specify whether to download Git-LFS files:
          lfs: false

          # Avoid storing GitHub token in local Git configuration:
          persist-credentials: false
        timeout-minutes: 10

      # Install Node.js:
      - name: 'Install Node.js'
        # Pin action to full length commit SHA
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20' # 'lts/*'
        timeout-minutes: 5

      # Install dependencies (accounting for possible network failures, etc, when installing node module dependencies):
      - name: 'Install dependencies'
        run: |
          make install-node-modules || make install-node-modules || make install-node-modules
        timeout-minutes: 15

      # Get list of changed files:
      - name: 'Get list of changed files'
        id: changed-files
        continue-on-error: true
        run: |
          # Get changed files by comparing the current commit to the commit before the push event or with its parent:
          if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --diff-filter=AM --name-only HEAD~ ${{ github.event.after }})
          else
            files=$(git diff --diff-filter=AM --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi
          # Keep only package.json files in math/base/special directories:
          files=$(echo "$files" | grep -E 'lib/node_modules/@stdlib/math/base/special/.*/package\.json$' | tr '\n' ' ' | sed 's/ $//')
          echo "files=${files}" >> $GITHUB_OUTPUT

      # Update unary database:
      - name: 'Update unary database'
        run: |
          files="${{ steps.changed-files.outputs.files }}"
          if [ -n "$files" ]; then
            echo "Changed package.json files detected: $files"
            echo "Updating unary database..."
            node lib/node_modules/@stdlib/math/special/scripts/generate_unary_database.js
            echo "Unary database updated successfully."
          else
            echo "No relevant package.json files changed. Skipping database update."
          fi
        timeout-minutes: 10

      # Check if database was updated:
      - name: 'Check for database changes'
        id: check-changes
        run: |
          if git diff --quiet lib/node_modules/@stdlib/math/special/data/unary.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to unary database."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Unary database has been updated."
          fi

      # Generate PR body with details of changed packages:
      - name: 'Generate PR body'
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          files="${{ steps.changed-files.outputs.files }}"

          # Create PR body following stdlib convention
          body="This PR

          -   updates the unary database

          ## Changed packages:
          "

          # List changed packages
          for file in $files; do
            pkg_name=$(echo "$file" | sed 's|lib/node_modules/||' | sed 's|/package.json||')
            body="${body}
          -   \`${pkg_name}\`"
          done

          body="${body}

          ## Database changes:

          The following changes were made to \`lib/node_modules/@stdlib/math/special/data/unary.json\`:

          \`\`\`diff
          $(git diff lib/node_modules/@stdlib/math/special/data/unary.json)
          \`\`\`"

          # Escape '%' characters for printf
          body="${body//%/%%}"

          # Write to file
          printf "$body" > /tmp/pr_body.md
        shell: bash

      # Create pull request with updated database:
      - name: 'Create pull request'
        if: steps.check-changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          title: 'chore: update unary database'
          body-path: /tmp/pr_body.md
          commit-message: 'chore: update unary database'
          committer: 'stdlib-bot <82920195+stdlib-bot@users.noreply.github.com>'
          signoff: true
          token: ${{ secrets.STDLIB_BOT_PAT_REPO_WRITE }}
          branch: update-unary-database
          delete-branch: true
          labels: |
            automated-pr
            database
          team-reviewers: |
            reviewers
          add-paths: |
            lib/node_modules/@stdlib/math/special/data/unary.json

      # Show PR information:
      - name: 'Show pull request information'
        if: steps.check-changes.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        run: |
          echo "✅ Pull request created successfully!"
          echo "PR Number: ${{ steps.cpr.outputs.pull-request-number }}"
          echo "PR URL: ${{ steps.cpr.outputs.pull-request-url }}"
          echo ""
          echo "The unary database has been updated and is ready for review."
